<style>
/* Layout: sticky top bar with section tabs (scrolls sideways on phones), one working column below.
   Exam texts sit on "paper" in a serif face like the AHS answer booklet; everything you click is in the sans.

:root{
  --bg:#f6f8fb; --panel:#ffffff; --ink:#172033; --muted:#566278; --line:#dbe2ec; --soft:#eef2f8;
  --blue:#1f4fd6; --blue-soft:#e8eefd; --green:#13793a; --green-soft:#e3f3e8; --red:#c42f29; --red-soft:#fceae9;
  --amber:#8a5300; --amber-soft:#fff1d6; --paper:#fffefb; --mark:#fff0a6; --bar:#1f4fd6; --bar2:#7a8aa8;
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-paper:"Source Serif 4","Georgia","Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131d; --panel:#151c29; --ink:#e5eaf3; --muted:#9ba7bb; --line:#283246; --soft:#1b2433;
  --blue:#82a4ff; --blue-soft:#1b2848; --green:#5fcf8a; --green-soft:#15301f; --red:#ff8a83; --red-soft:#3a1c1c;
  --amber:#f2bb5c; --amber-soft:#3a2b10; --paper:#171f2d; --mark:#5b4b0e; --bar:#82a4ff; --bar2:#8b97ad; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131d; --panel:#151c29; --ink:#e5eaf3; --muted:#9ba7bb; --line:#283246; --soft:#1b2433;
  --blue:#82a4ff; --blue-soft:#1b2848; --green:#5fcf8a; --green-soft:#15301f; --red:#ff8a83; --red-soft:#3a1c1c;
  --amber:#f2bb5c; --amber-soft:#3a2b10; --paper:#171f2d; --mark:#5b4b0e; --bar:#82a4ff; --bar2:#8b97ad; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55; margin:0}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--panel)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2.5px solid var(--blue); outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display); line-height:1.2; text-wrap:balance; margin:0}
h2{font-size:1.55rem} h3{font-size:1.15rem} h4{font-size:1rem}
p{margin:0}
a{color:var(--blue)}
.wrap{max-width:1040px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--panel); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; gap:18px; padding-block:10px}
.brand{font-family:var(--f-display); font-weight:700; font-size:1.02rem; white-space:nowrap}
.brand small{display:block; font-family:var(--f-body); font-weight:400; color:var(--muted); font-size:.74rem}
.tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; min-width:0; flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none; text-decoration:none; color:var(--muted); padding:7px 11px; border-radius:8px; font-size:.92rem; font-weight:700}
.tabs a:hover{background:var(--soft); color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--blue-soft); color:var(--blue)}
@media (max-width:720px){.top .wrap{flex-direction:column; align-items:stretch; gap:6px} .brand small{display:inline; margin-left:6px}}

main.wrap{padding-block:26px 120px}
.view{display:grid; gap:22px}
.lead{color:var(--muted); max-width:44rem}
.eyebrow{font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700}
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; display:grid; gap:12px; min-width:0}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:14px}
.grid4{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:14px}
.muted{color:var(--muted)} .small{font-size:.88rem}
ul.clean{margin:0; padding-left:1.1em; display:grid; gap:4px}

/* chips and buttons */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:.9rem; font-weight:700; color:var(--muted)}
.chip:hover{border-color:var(--blue); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:var(--panel)}
.chip .n{font-weight:400; opacity:.8; margin-left:4px}
.btn{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:7px 13px; cursor:pointer; font-weight:700; font-size:.92rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--blue); border-color:var(--blue); color:var(--panel)}
.btn.ghost{background:transparent}
.btn.ans{color:var(--blue); border-color:transparent; background:var(--blue-soft)}
.btn.small{padding:4px 9px; font-size:.82rem}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.spacer{flex:1}
.pill{display:inline-block; border-radius:999px; padding:2px 9px; font-size:.78rem; font-weight:700; background:var(--soft); color:var(--muted)}
.pill.green{background:var(--green-soft); color:var(--green)} .pill.red{background:var(--red-soft); color:var(--red)} .pill.amber{background:var(--amber-soft); color:var(--amber)} .pill.blue{background:var(--blue-soft); color:var(--blue)}
.score{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:.9rem}

/* question items */
.qlist{display:grid; gap:10px}
.q{border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:var(--panel); display:grid; gap:8px}
.q.ok{border-color:var(--green); background:var(--green-soft)}
.q.bad{border-color:var(--red)}
.q .qn{font-family:var(--f-mono); font-size:.8rem; color:var(--muted); margin-right:6px}
.q .tx{min-width:0}
input.gap{border:0; border-bottom:2px solid var(--muted); background:transparent; padding:1px 4px; min-width:5ch; max-width:100%; border-radius:0; font-weight:700; color:var(--blue)}
input.gap:focus{outline:none; border-bottom-color:var(--blue); background:var(--blue-soft)}
.ok input.gap, input.gap.ok{border-bottom-color:var(--green); color:var(--green)}
input.gap.bad{border-bottom-color:var(--red); color:var(--red)}
.blank{display:inline-block; min-width:6ch; border-bottom:2px solid var(--muted)}
.opts{display:flex; flex-wrap:wrap; gap:6px}
.opt{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 11px; cursor:pointer; text-align:left}
.opt:hover{border-color:var(--blue)}
.opt.ok{border-color:var(--green); background:var(--green-soft); color:var(--green); font-weight:700}
.opt.bad{border-color:var(--red); background:var(--red-soft); color:var(--red); text-decoration:line-through}
.opt .l{font-family:var(--f-mono); font-weight:500; margin-right:6px; color:var(--muted)}
.fb{font-size:.88rem}
.fb.ok{color:var(--green)} .fb.bad{color:var(--red)}
.kw{font-family:var(--f-mono); font-weight:500; background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:1px 7px; letter-spacing:.04em}

/* exam paper */
.paper{background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:22px clamp(16px,4vw,34px); font-family:var(--f-paper); font-size:1.06rem; line-height:1.75; display:grid; gap:14px; min-width:0}
.paper h3{font-family:var(--f-paper); font-weight:600; text-align:center; font-size:1.3rem}
.paper .instr{font-family:var(--f-body); font-size:.92rem; font-weight:700; line-height:1.5}
.paper .head{display:flex; justify-content:space-between; gap:10px; font-family:var(--f-body); font-size:.78rem; color:var(--muted); border-bottom:1px solid var(--line); padding-bottom:6px}
.paper .pts{font-weight:700; color:var(--ink)}
.paper p{margin:0}
.paper .para-l{font-family:var(--f-body); font-weight:700; font-size:.85rem; color:var(--muted)}
.gn{font-family:var(--f-body); font-size:.78rem; font-weight:700; color:var(--muted); margin-right:2px}
.paper select, .paper input.gap{font-family:var(--f-body); font-size:.95rem}
.paper select{border:1px solid var(--line); border-radius:6px; padding:1px 4px; background:var(--panel); max-width:100%}
.paper select.ok{border-color:var(--green); color:var(--green); font-weight:700}
.paper select.bad{border-color:var(--red); color:var(--red)}
.qbtn{border:0; background:var(--blue-soft); color:var(--blue); border-radius:50%; width:1.35em; height:1.35em; font-size:.75rem; font-weight:700; cursor:pointer; vertical-align:.15em; margin-left:2px; padding:0; font-family:var(--f-body)}
.bank{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr)); gap:4px 14px; font-family:var(--f-body); font-size:.92rem; border:1px solid var(--line); border-radius:8px; padding:10px 12px}
.bank b{font-family:var(--f-mono); margin-right:6px}
.bank .used{opacity:.45; text-decoration:line-through}
.split{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; align-items:start}
.split > .sticky{position:sticky; top:84px; max-height:calc(100vh - 100px); overflow:auto}
@media (max-width:860px){.split{grid-template-columns:1fr} .split > .sticky{position:static; max-height:none}}
table.t{border-collapse:collapse; width:100%; font-size:.92rem}
table.t th, table.t td{border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top}
table.t th{background:var(--soft); font-weight:700}
.tablebox{overflow-x:auto}

/* vocab */
.vtable td:first-child{font-weight:700}
.vtable .de{color:var(--muted)}
.vtable tr.weak td:first-child::after{content:"★"; color:var(--amber); margin-left:5px}
.flash{border:1px solid var(--line); border-radius:14px; background:var(--panel); min-height:220px; display:grid; place-items:center; text-align:center; padding:26px 20px; gap:10px}
.flash .big{font-family:var(--f-display); font-size:clamp(1.3rem,4vw,1.9rem); font-weight:700}
.flash .def{font-size:1.1rem; max-width:34rem}
.flash .ex{font-family:var(--f-paper); font-style:italic; color:var(--muted); max-width:36rem}
.meter{height:8px; background:var(--soft); border-radius:99px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--green); width:0}
textarea{width:100%; border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:10px 12px; line-height:1.6; resize:vertical}
textarea.paperish{font-family:var(--f-paper); font-size:1.02rem; min-height:420px}
input.text{border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:7px 10px; width:100%}

/* report bits */
.rep{font-family:var(--f-paper); line-height:1.7; display:grid; gap:10px}
.rep .hd{font-family:var(--f-mono); font-size:.88rem; line-height:1.6}
.rep h4{font-family:var(--f-paper); font-weight:600; text-decoration:underline; text-underline-offset:3px}
.rep mark{background:var(--mark); color:inherit; border-radius:3px; padding:0 2px; cursor:help}
.rep mark sup{font-family:var(--f-mono); font-size:.68rem; color:var(--muted)}
.notes{display:grid; gap:4px; font-size:.88rem; counter-reset:n}
.fix{display:grid; gap:6px; border-left:3px solid var(--red); padding-left:12px}
.fix .before{color:var(--red); text-decoration:line-through; text-decoration-thickness:1px}
.fix .after{color:var(--green)}
.check li.bad{color:var(--red)} .check li.ok{color:var(--green)} .check li.warn{color:var(--amber)}
.chart svg{width:100%; height:auto; display:block}
.chart text{fill:var(--ink); font-family:var(--f-body)}
.chart .lab{fill:var(--muted)}
.timer{font-family:var(--f-mono); font-size:1.4rem; font-variant-numeric:tabular-nums}

/* modal */
.modal{position:fixed; inset:0; z-index:50; background:rgba(10,15,28,.5); display:grid; place-items:center; padding:16px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .box{background:var(--panel); border:1px solid var(--line); border-radius:14px; max-width:560px; width:100%; max-height:85vh; overflow:auto; padding:20px; display:grid; gap:12px; box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .box .ansline{font-size:1.15rem}
.modal .box .ansline b{color:var(--green)}
@media (prefers-reduced-motion:no-preference){.q.bad{animation:shake .25s}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.note{background:var(--amber-soft); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:.93rem}
.note.blue{background:var(--blue-soft)}
.hr{height:1px; background:var(--line)}
</style>

["to incarcerate","inhaftieren","to put someone in prison","More than a million people are {incarcerated} in American state prisons."],

["to grant freedom to sb","jdm. Freiheit gewähren","to officially give someone the right to be free","The Emancipation Proclamation of 1863 was meant to {grant freedom to} enslaved people in the rebel states."],
["economic system","das Wirtschaftssystem","the way a country produces, sells and shares goods and money","The {economic system} of the Southern states depended on slave labour."],
["to exploit a loophole","eine Gesetzeslücke ausnutzen","to use a gap or weakness in a law to gain an advantage","Southern states {exploited a loophole} in the 13th Amendment that still allowed forced labour as punishment for a crime."],

["menacing","bedrohlich, drohend","looking or sounding dangerous; threatening","The officer described the unarmed teenager as {menacing}, although he was only walking home."],
["lynching","Lynchmord, lynchen","the killing of a person by a mob without a legal trial, often by hanging","Thousands of African Americans were victims of {lynching} in the South between 1880 and 1950."],
["refugee","Flüchtling","a person who has to leave their country because of war, danger or persecution","Many {refugees} who arrive in Europe have fled from war."],
["injustice","Ungerechtigkeit","a situation in which people are treated unfairly","Martin Luther King wrote that {injustice} anywhere is a threat to justice everywhere."],
["civil rights","Bürgerrechte","the rights every citizen should have, e.g. to vote and to be treated equally","The right to vote is one of the most important {civil rights}."],

["to enact a law","ein Gesetz beschließen","to make a law officially valid","Congress {enacted} the Civil Rights Act in 1964."],
["to pass a law","ein Gesetz verabschieden","(of a parliament) to vote to accept a new law","The Voting Rights Act was {passed} in 1965."],
["segregation laws / Jim Crow laws","Rassentrennungsgesetze","state and local laws in the US South (late 19th – mid 20th century) that enforced racial segregation","Under the {Jim Crow} laws, Black and white people had to use separate schools, buses and restaurants."],
["to segregate","trennen (nach Rasse, Religion, Geschlecht)","to keep groups of people apart, especially because of race or religion","Until 1954, many public schools in the South were {segregated} by race."],
["to abolish slavery / the abolition of slavery","Sklaverei abschaffen / Abschaffung der Sklaverei","to officially end slavery","The 13th Amendment {abolished} slavery in the United States in 1865."],
["criminalization","Kriminalisierung","making something illegal, or treating a group of people as criminals","Activists protest against the {criminalization} of poverty."],
["to be traced back to","zurückverfolgt werden (bis zu)","to have its origin in something earlier (your sheet says ‘tracked back to’ – ‘traced back to’ is the usual form)","Many of today’s inequalities can be {traced back to} slavery and segregation."],
["to be subjected to","etw. ausgesetzt sein","to have something bad done to you","Many prisoners {are subjected to} violence and humiliation."],

["resistance","der Widerstand","the act of fighting against something","Non-violent {resistance} was the main strategy of Martin Luther King."],
["to gain equal rights","die gleichen Rechte erlangen","to finally receive the same rights as everybody else","African Americans had to fight for decades to {gain equal rights}."],
["discriminatory laws","diskriminierende Gesetze","laws that treat one group of people worse than others","Literacy tests were {discriminatory} laws designed to stop Black citizens from voting."],

{id:"usa", name:"English in Context 7 · Topic 3 · Unit 6 (USA)", short:"Topic 3 Unit 6", words:[

{id:"report-speech", name:"Reporting survey results", tag:"report",
rule:`<p>In a report you <b>report what people said</b> in a survey (Task 6 on your sheet). Use a reporting verb: <i>said, stated, reported, claimed, indicated, admitted, explained, mentioned</i>.</p>
<table class="t"><tr><th>Direct statement</th><th>Reported (past tense = backshift)</th></tr>
<tr><td>“I <b>want</b> to be an athlete.”</td><td>29% said that they <b>wanted</b> to be athletes.</td></tr>
<tr><td>“I <b>would like</b> to work with animals.”</td><td>15% stated that they <b>would like</b> to work with animals. (<i>would</i> stays)</td></tr>
<tr><td>“I <b>have never had</b> a careers day.”</td><td>Many said that they <b>had never had</b> a careers day.</td></tr>
<tr><td>“The workshops <b>will</b> help.”</td><td>Students said that the workshops <b>would</b> help.</td></tr></table>
<p><b>Present tense reporting</b> (<i>The survey shows / 29% say that they want…</i>) needs <b>no backshift</b>. Pick one style and keep it. Questions: <i>Students were asked <b>whether / if</b> they… / what they wanted to do</i> (no question word order).</p>`,
items:[
{q:"29% said, “I want to be a professional athlete.” → 29% said that they ___ (want) to be professional athletes.",a:["wanted"],ex:"Past reporting verb (said) → present simple becomes past simple."},
{q:"15% stated, “I would like to work with animals.” → 15% stated that they ___ like to work with animals.",a:["would"],ex:"‘would’ does not change in reported speech."},
{q:"19% reported, “I enjoy drawing.” → 19% reported that they ___ (enjoy) drawing.",a:["enjoyed"],ex:"enjoy → enjoyed (backshift after a past reporting verb)."},
{q:"12% indicated, “I think being a doctor would be interesting.” → 12% indicated that they ___ (think) being a doctor would be interesting.",a:["thought"],ex:"think → thought. ‘would be’ stays."},
{q:"Many students said, “We have never had a careers day.” → Many students said that they ___ never ___ a careers day.",a:["had had","had never had"],ex:"Present perfect (have had) → past perfect (had had). Type: had had."},
{q:"Several respondents said, “The workshops will be useful.” → They said that the workshops ___ be useful.",a:["would"],ex:"will → would."},
{q:"The survey shows that most students ___ (prefer) practical lessons. (present tense reporting)",a:["prefer"],ex:"The reporting verb ‘shows’ is in the present, so there is no backshift."},
{q:"Students were asked ___ they used public transport every day.",a:["whether","if"],ex:"Reported yes/no question → if / whether, normal word order (they used)."},
{t:"mc",q:"Only 5% ___ that they did not care about their health.",o:["told","admitted","spoke","talked"],a:1,ex:"admit + that-clause. ‘told’ needs a person (told us that…); ‘spoke/talked’ cannot be followed by ‘that’."},
{t:"mc",q:"Respondents were asked what ___.",o:["did they want to study","they wanted to study","do they want to study","wanted they to study"],a:1,ex:"Reported questions use statement word order: what they wanted…"}
]},
{id:"report-prep", name:"Prepositions & numbers in reports", tag:"report",
rule:`<p>Task 7 on your sheet tested exactly these. Learn them as chunks:</p>
<table class="t">
<tr><td><b>ask sb about</b> sth</td><td><b>according to</b> the survey</td></tr>

<tr><td>last <b>in terms of</b> popularity</td><td><b>over</b> / just over half</td></tr>
<tr><td>be based <b>on</b></td><td>account <b>for</b> 15% of…</td></tr>
<tr><td>rise / fall <b>by</b> 10% (the difference)</td><td>rise <b>from</b> 20% <b>to</b> 30%</td></tr>
<tr><td>be interested <b>in</b> / a career <b>in</b> health</td><td>work <b>in</b> the field <b>of</b> sports</td></tr></table>
<p><b>Number phrases:</b> 52% = just over half · 48% = just under half / nearly half · 33% = a third · 30% = just under a third · 25% = a quarter · 20% = a fifth · 10% = one in ten · 70–90% = the (vast) majority · 2–5% = a small minority.</p>`,

{id:"compare", name:"Comparing figures", tag:"report",

{id:"tenses-present", name:"Present tenses", tag:"tense",

<p><b>Stative verbs</b> are (almost) never continuous: <i>know, understand, believe, want, need, like, belong, seem, own, taste (= has a taste)</i>.</p>`,

{id:"tenses-past", name:"Past & present perfect", tag:"tense",
rule:`<table class="t">
<tr><td><b>Past simple</b></td><td>finished time: <i>yesterday, in 1964, last year, ago</i> — <i>Congress passed the law in 1964.</i></td></tr>
<tr><td><b>Past continuous</b></td><td>background action: <i>While I was cycling home, it started to rain.</i></td></tr>

<tr><td><b>Present perfect</b></td><td>unfinished time / result now / experience: <i>since, for, ever, never, just, already, yet</i> — <i>Gun deaths have risen since 2010.</i></td></tr>
<tr><td><b>Present perfect continuous</b></td><td>activity up to now, emphasis on duration: <i>I have been studying all afternoon.</i></td></tr>
<tr><td><b>used to / would</b></td><td>past habits: <i>Black passengers used to sit at the back.</i></td></tr></table>`,
items:[
{q:"While I ___ (cycle) home, it started to rain.",a:["was cycling"],ex:"Background action interrupted → past continuous."},
{q:"When we arrived at the cinema, the film ___ (already / start).",a:["had already started"],ex:"Earlier past action → past perfect."},
{q:"Martin Luther King ___ (give) his famous speech in 1963.",a:["gave"],ex:"Finished time (1963) → past simple."},
{q:"Before the Civil Rights Act, Black citizens in the South ___ use separate restaurants.",a:["had to","used to"],ex:"Past obligation → had to; past habit → used to."},

{q:"I ___ (never / be) to the USA.",a:["have never been"],ex:"Experience up to now → present perfect."},

{q:"___ (you / ever / eat) sushi?",a:["have you ever eaten"],ex:"ever → present perfect question."},
{q:"How long ___ (you / know) your best friend?",a:["have you known"],ex:"know is stative → present perfect simple (not continuous)."},
{q:"I’m exhausted. I ___ (study) all afternoon.",a:["have been studying"],ex:"Activity up to now with visible result, emphasis on duration → present perfect continuous."},
{q:"The number of school shootings ___ (increase) since 2010.",a:["has increased","has been increasing"],ex:"since 2010 → present perfect. Very common in reports!"},
{t:"mc",q:"When ___ the accident?",o:["did you see","have you seen","had you seen","are you seeing"],a:0,ex:"‘When…?’ asks about a finished time → past simple."}
]},
{id:"future", name:"Future forms", tag:"tense",

{id:"passive", name:"Passive voice", tag:"struct",

{id:"conditionals", name:"Conditionals & wishes", tag:"struct",
rule:`<table class="t">

{id:"relative", name:"Relative clauses", tag:"struct",
rule:`<p><b>who</b> people · <b>which</b> things · <b>that</b> people/things (only defining!) · <b>whose</b> possession · <b>where</b> place · <b>when</b> time.</p>

{id:"r-summ", kind:"summ", pts:9, label:"2 · Matching summaries (A–L)", title:"Ten places to discover civil rights history",

paras:[
"The National Museum of African American History and Culture opened on the National Mall in Washington, D.C., in 2016. Entry is free, but the museum is so popular that you usually need a timed pass booked well in advance. The tour starts deep underground with the slave trade and slowly rises, floor by floor, to the present day.",
"The National Civil Rights Museum in Memphis is built around the Lorraine Motel, where Martin Luther King was shot on its balcony in April 1968. Room 306, where he stayed, has been kept just as it looked that evening, with the beds unmade and dishes still on the table.",
"In Selma, Alabama, peaceful marchers were attacked by state troopers on the Edmund Pettus Bridge on ‘Bloody Sunday’ in March 1965. Every year, thousands of people cross the bridge again to remember them. Many want it to be renamed, because Pettus was a Confederate general and a leader of the Ku Klux Klan.",
"The Rosa Parks Museum in Montgomery stands on the corner where Parks boarded her bus in 1955. Its highlight is a full-size replica of the bus: visitors sit inside while a video projected onto the windows recreates the evening of her arrest.",
"Also in Montgomery, the Legacy Museum was founded by a human rights organisation that provides legal help to prisoners. It traces a direct line from slavery and lynching to segregation and today’s mass incarceration, using interactive displays and recorded stories of people in prison.",
"Nearby, the National Memorial for Peace and Justice is dedicated to the victims of lynching. More than 800 steel columns hang from the roof, one for every US county where lynchings took place, each engraved with the names of the people who were killed there.",
"In 1957, nine Black teenagers needed soldiers to escort them into Little Rock Central High School after the governor tried to stop them from entering. The building is now a National Historic Site, but it is also still a working school, so tours are led by park rangers and have to be booked ahead.",
"The International Civil Rights Center & Museum in Greensboro, North Carolina, is housed in the former Woolworth store where four Black college students sat down at a ‘whites only’ lunch counter in 1960 and refused to leave. Their sit-in was copied in dozens of cities within weeks, and the original counter can still be seen.",
"In 1963, a bomb planted by members of the Ku Klux Klan exploded at the 16th Street Baptist Church in Birmingham, Alabama, killing four girls. Despite the attack, the church has remained a place of worship ever since, and visitors are welcome to join the Sunday service.",
"In Atlanta, the Martin Luther King Jr. National Historical Park brings together the house where King was born, the church where he and his father preached, and the tomb where he and his wife are buried. Admission to all the sites is free."
],

paras:[
"When delegates met in Philadelphia in the summer of 1787, their official task was to improve the Articles of Confederation, the agreement that had held the thirteen former colonies together since the War of Independence. The Articles had left the national government extremely weak: it could not even raise taxes, and it depended on the states for money.",
"Instead of repairing the old agreement, the delegates wrote an entirely new document: the Constitution. It created three branches of government – the legislature, the executive and the judiciary – and a system of checks and balances designed to prevent any single branch from becoming too powerful.",
"However, many Americans were suspicious. A group known as the Anti-Federalists warned that a strong central government might one day threaten the freedoms they had just won from Britain. They demanded a written list of individual rights, and in several states the Constitution was only accepted after its supporters promised that such a list would be added later.",
"The task of drafting it fell to James Madison, a congressman from Virginia who had at first believed that a bill of rights was unnecessary. He collected proposals from the states and in 1789 presented a set of amendments to Congress. Ten of them were ratified by the states in December 1791 and became known as the Bill of Rights.",
"The First Amendment protects freedom of religion, speech and the press, as well as the right to protest peacefully. The Second Amendment, which mentions ‘a well regulated Militia’, protects ‘the right of the people to keep and bear Arms’ – a sentence whose meaning is still fiercely debated today. Other amendments protect citizens against unreasonable searches and guarantee the right to a fair and speedy trial.",
"At first, the Bill of Rights only limited the federal government, not the individual states. It was not until after the Civil War, with the Fourteenth Amendment of 1868, that courts gradually began to apply these rights to state governments as well."

html:`<div class="hd">To: Marketing Department<br>From: Leon<br>Date: 1 November 2026<br>Subject: Attracting young customers to organic food</div>
<h4>Introduction</h4>
<p><mark data-n="1">The aim of this report is to</mark> present data on organic food consumption by age, <mark data-n="2">to analyse</mark> why young people buy comparatively little organic food <mark data-n="2">and to make recommendations</mark> on how to attract younger customers. <mark data-n="3">It is based on</mark> a pie chart published by the UK Food Agency.</p>
<h4>Results</h4>
<p><mark data-n="4">The chart illustrates that</mark> 39- to 48-year-olds consume the most organic food, accounting for 30% of the total. <mark data-n="5">They are followed by</mark> people aged 29–38 and 49–58, with 20% each, <mark data-n="5">while</mark> the over-58s account for 15%. <mark data-n="5">In contrast,</mark> consumption drops sharply among younger people: 19- to 28-year-olds account for <mark data-n="6">only</mark> 10%, and the youngest group (9–18) for <mark data-n="6">just</mark> 5%.</p>
<h4>Analysis</h4>
<p><mark data-n="7">Several factors may explain these results.</mark> <mark data-n="7">The most likely reason is</mark> price, as organic products are considerably more expensive and young people usually have a limited budget. <mark data-n="5">Furthermore,</mark> organic food goes off more quickly. <mark data-n="5">Nevertheless,</mark> a large number of teenagers track their calorie and protein intake, <mark data-n="7">which suggests that</mark> there is real interest in healthy eating.</p>
<h4>Recommendations</h4>
<p>In order to attract more young customers, <mark data-n="8">it would be advisable to</mark> offer student discounts. <mark data-n="5">In addition,</mark> <mark data-n="8">the company should consider</mark> increasing its presence on social media platforms such as TikTok and Instagram, which teenagers use every day.</p>
<h4>Conclusion</h4>
<p><mark data-n="9">To sum up,</mark> young people currently buy the least organic food, mainly because of the price. However, with lower prices and a stronger online presence, the company could win a significant number of new customers.</p>`,

{id:"m-jobs", title:"Model answer: Task 8 – career aspirations of 16-year-olds", words:"≈ 220 words",
html:`<div class="hd">To: The Principal<br>From: Student representative, 7C<br>Date: 13 November 2026<br>Subject: Career goals of older students</div>
<h4>Introduction</h4>
<p><mark data-n="1">The purpose of this report is to</mark> summarise how 16-year-olds see their professional future, to compare their answers with those of 11-year-olds and to suggest how the school could support students in their final years. <mark data-n="1">It is based on</mark> a survey of 330,000 young people carried out by The Careers &amp; Enterprise Company.</p>
<h4>Results</h4>
<p><mark data-n="2">Among 16-year-olds, the most popular field is</mark> health (13.9%), <mark data-n="3">closely followed by</mark> art and music (13%) and sport (11.3%). <mark data-n="2">Just over one in ten</mark> respondents (10.4%) are still unsure, and the same proportion would like to work in research and science. <mark data-n="3">By comparison,</mark> sport is <mark data-n="2">by far</mark> the favourite among 11-year-olds, chosen by <mark data-n="2">just under a third</mark>.</p>
<h4>Analysis</h4>
<p><mark data-n="4">This shift may be due to</mark> the fact that older students have a more realistic picture of the job market. <mark data-n="4">It is likely that</mark> careers in sport seem less achievable at 16, <mark data-n="3">whereas</mark> jobs in health offer security. <mark data-n="3">Nevertheless,</mark> a significant number of students have not yet made a decision.</p>
<h4>Recommendations</h4>
<p><mark data-n="5">It would be beneficial to</mark> organise career days on which professionals from different fields describe their daily work. <mark data-n="3">Furthermore,</mark> <mark data-n="5">the school should consider</mark> offering short work placements, so that undecided students can gain first-hand experience.</p>
<h4>Conclusion</h4>
<p><mark data-n="6">Overall,</mark> the aspirations of 16-year-olds are more varied and realistic than those of younger students. With practical career guidance, the school could help them make better-informed decisions.</p>`,

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/–|—/g,"-").trim();
  s=s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"cannot").replace(/\bshan't\b/g,"shall not").replace(/n't\b/g," not")
     .replace(/'ll\b/g," will").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/\bi'm\b/g,"i am").replace(/\bcan not\b/g,"cannot");
  s=s.replace(/[.!?,;:]+$/,"").replace(/^[.!?,;:]+/,"").replace(/\s+/g," ").trim();
  return s;
}
function isRight(input,answers,must){
  const n=norm(input); if(!n) return false;
  if((answers||[]).some(a=>norm(a)===n)) return true;
  if(must && must.length){ return must.every(g=>g.some(t=>n.includes(t))) }
  return false;
}

function qItem(it,id,num,opts={}){
  const t=it.t||"gap";
  const d=h(`<div class="q" data-id="${esc(id)}"></div>`);
  const showAns=()=>{
    if(t==="mc") popup("Answer",`<p class="ansline">Answer: <b>${LETTERS[it.a]} – ${esc(it.o[it.a])}</b></p>${it.ex?`<p>${esc(it.ex)}</p>`:""}${opts.extra||""}`);
    else if(t==="self") popup("Model answer",`<p class="ansline"><b>${esc(it.m)}</b></p><p class="small muted">Compare with yours: same meaning, formal, no I/we, no contractions?</p>`);
    else popup("Answer",ansHTML(it.a,it.ex,opts.extra));
  };
  const numH=num!=null?`<span class="qn">${num}</span>`:"";
  if(t==="mc"){
    d.append(h(`<div class="tx">${numH}${esc(it.q).replace("___",'<span class="blank"></span>')}</div>`));
    const o=h(`<div class="opts"></div>`); d.append(o); let fbm;
    it.o.forEach((txt,i)=>{const b=h(`<button class="opt"><span class="l">${LETTERS[i]}</span>${esc(txt)}</button>`);
      b.onclick=()=>{ if(d.dataset.done) return; const ok=i===it.a; b.classList.add(ok?"ok":"bad"); if(!ok){o.children[it.a].classList.add("ok")} d.dataset.done=1; d.classList.add(ok?"ok":"bad"); mark(id,ok); fbm.textContent=ok?"Correct.":"Not quite – tap “Why?” for the explanation."; fbm.className="fb "+(ok?"ok":"bad"); opts.onResult&&opts.onResult(ok)};
      o.append(b)});
    const row=h(`<div class="row"><span class="fb"></span><span class="spacer"></span><button class="btn small ans">Why?</button></div>`); d.append(row);
    fbm=$(".fb",row); $(".ans",row).onclick=showAns; return d;
  }
  if(t==="self"){
    d.append(h(`<div class="tx">${numH}${esc(it.q)}</div>`));
    d.append(h(`<textarea rows="2" placeholder="Write your version…"></textarea>`));
    const row=h(`<div class="row"><span class="small muted">Self-check: write it, then compare.</span><span class="spacer"></span><button class="btn small ans">Show model</button></div>`); d.append(row);
    $(".ans",row).onclick=showAns; return d;
  }
  let pre="",post="",txt;
  if(t==="key"){ d.append(h(`<div class="tx">${numH}${esc(it.s1)}</div>`)); d.append(h(`<div><span class="kw">${esc(it.k)}</span></div>`)); txt=it.s2 }
  else txt=it.q;
  const parts=String(txt).split("___"); pre=parts[0]; post=parts.slice(1).join("___");
  const w=Math.max(6,Math.min(28,(it.a&&it.a[0]?it.a[0].length:8)+3));
  const line=h(`<div class="tx">${t!=="key"?numH:""}${esc(pre)}<input class="gap" aria-label="answer" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${w}ch">${esc(post)}${it.base?` <span class="kw">${esc(it.base)}</span>`:""}</div>`);
  d.append(line);
  const inp=$("input",line);
  const row=h(`<div class="row"><button class="btn small chk">Check</button><span class="fb"></span><span class="spacer"></span><button class="btn small ans">Answer</button></div>`); d.append(row);
  const fb=$(".fb",row);
  const check=()=>{
    const v=inp.value; if(!v.trim()){inp.focus();return}
    let ok=isRight(v,it.a,it.must);
    if(ok && it.max){ if(norm(v).split(" ").length>it.max){ok=false; fb.textContent=`Too many words – max. ${it.max}.`} }
    d.classList.remove("ok","bad"); void d.offsetWidth; d.classList.add(ok?"ok":"bad");
    if(ok||!fb.textContent.startsWith("Too")) fb.textContent=ok?"Correct.":"Not yet. Try again or tap Answer.";
    fb.className="fb "+(ok?"ok":"bad"); mark(id,ok); opts.onResult&&opts.onResult(ok);
  };
  $(".chk",row).onclick=check; inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check()}});
  inp.addEventListener("input",()=>{fb.textContent="";});
  $(".ans",row).onclick=showAns;
  return d;
}

function parseSent(s){ const m=s.match(/\{([^}]*)\}/); return {ans:m?m[1]:"", gap:s.replace(/\{[^}]*\}/,"___"), full:s.replace(/[{}]/g,"")} }
function allWords(){
  const out=[];
  VOCAB.forEach(set=>set.words.forEach((w,i)=>{const p=parseSent(w[3]); out.push({id:`v:${set.id}:${i}`,set:set.id,setName:set.short,term:w[0],de:w[1],def:w[2],sent:w[3],ans:p.ans,gap:p.gap,full:p.full,weak:!!w[4]})}));
  const mine=store.get("mywords",""); parseMine(mine).forEach((w,i)=>out.push(Object.assign(w,{id:"v:mine:"+i+":"+w.term,set:"mine",setName:"My words"})));
  return out;
}
function parseMine(txt){
  return String(txt||"").split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    let p=l.split(/\s*[;\t|]\s*|\s+[-–=]\s+/); const term=(p[0]||"").trim(), meaning=(p[1]||"").trim(), sent=(p[2]||"").trim();
    let ans="",gap="",full=sent;
    if(sent){ const core=term.replace(/^to\s+/i,"").replace(/\b(sb|sth|smn|smth|somebody|something)\b/gi,"").trim();
      const tries=[core, core.split(/\s+/).sort((a,b)=>b.length-a.length)[0]||""];
      for(const c of tries){ if(c.length<3) continue; const stem=c.length>5?c.slice(0,c.length-2):c; const re=new RegExp("\\b("+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[\\w-]*)","i"); const m=sent.match(re); if(m){ans=m[1]; gap=sent.replace(m[0],"___"); break} } }
    return {term,de:/[äöüß]/i.test(meaning)?meaning:"",def:meaning,sent:"",ans,gap,full,weak:false};
  }).filter(w=>w.term);
}
function termVariants(term){
  return term.split(/\s*\/\s*|,\s*/).flatMap(v=>{v=v.replace(/\(.*?\)/g,"").replace(/\b(sb|sth|smn|smth|somebody|something)\b\.?/gi,"").replace(/\s+/g," ").trim();
    const a=[v]; if(/^to /i.test(v)) a.push(v.replace(/^to /i,"")); if(/^(a|the|an) /i.test(v)) a.push(v.replace(/^(a|the|an) /i,""));
    if(/ence$/.test(v)) a.push(v.replace(/ence$/,"ense")); if(/ense$/.test(v)) a.push(v.replace(/ense$/,"ence"));
    if(/ize/.test(v)) a.push(v.replace(/ize/g,"ise")); if(/licensed/.test(v)) a.push(v.replace("licensed","licenced")); return a}).filter(Boolean);
}
function vocabPopup(w){

}

    sents.forEach(([sp,s],i)=>{const u=new SpeechSynthesisUtterance(s);const v=voiceFor(sp);if(v){u.voice=v;u.lang=v.lang}else u.lang="en-GB";u.rate=rate;u.pitch=PITCH[sp]||1;if(i===sents.length-1){u.onend=()=>res();u.onerror=()=>res()}speechSynthesis.speak(u)});
    plays++; $("#plays").textContent=`played ${plays}×`; status(`Playing (${plays}${plays===1?"st":plays===2?"nd":"th"} time)…`) });
  const countdown=(sec,label)=>new Promise(res=>{let s=sec;status(`${label}: ${s}s`);timer=setInterval(()=>{s--;status(`${label}: ${s}s`);if(s<=0){clearInterval(timer);timer=null;res()}},1000)});
  let run=0;
  $("#pExam").onclick=async()=>{stopAll();const me=++run;await countdown(45,"Read the task");if(me!==run)return;await speak();if(me!==run)return;await countdown(15,"Pause");if(me!==run)return;await speak();if(me!==run)return;status("Finished – check your answers.")};
  $("#pPlay").onclick=async()=>{stopAll();const me=++run;await speak();if(me===run)status("Finished.")};
  $("#pPause").onclick=()=>{if(!has)return;if(speechSynthesis.paused){speechSynthesis.resume();$("#pPause").textContent="Pause"}else{speechSynthesis.pause();$("#pPause").textContent="Resume"}};
  $("#pStop").onclick=()=>{run++;stopAll();status("Stopped")};
  const task=h(`<div class="paper">${paperHead("Hören",t.qs?t.qs.length:4)}<p class="instr">${esc(t.instr)}</p></div>`);
  if(t.kind==="match"){
    task.append(h(`<div class="tablebox" style="font-family:var(--f-body)"><table class="t">${t.statements.map((s,i)=>`<tr><td style="width:2em"><b>${LETTERS[i]}</b></td><td>The speaker ${esc(s)}</td></tr>`).join("")}</table></div>`));
    const r=h(`<div class="row" style="font-family:var(--f-body)">${[1,2,3,4].map(n=>`<label class="row" style="gap:6px">Speaker ${n} <select data-k="${n-1}"><option value="">–</option>${LETTERS.slice(0,6).map(l=>`<option>${l}</option>`).join("")}</select></label>`).join("")}</div>`);
    const row=h(`<div class="row" style="font-family:var(--f-body)"><button class="btn primary">Check</button><button class="btn sh">Answers & why</button><span class="spacer"></span><span class="score"></span></div>`);
    task.append(r,row);
    $(".btn.primary",row).onclick=()=>{let c=0;$$("select",r).forEach(s=>{const k=+s.dataset.k;const ok=s.value===t.answers[k];s.style.borderColor=s.value?(ok?"var(--green)":"var(--red)"):"";if(ok)c++;mark(`h:${t.id}:${k}`,ok)});$(".score",row).textContent=`${c} / 4`};
    $(".sh",row).onclick=()=>popup("Answers",`<ul class="clean">${t.expl.map(e=>`<li>${esc(e)}</li>`).join("")}</ul><p class="small muted">Not used: ${t.extra.join(", ")}</p>`);
  } else {
    const ql=h(`<div class="qlist" style="font-family:var(--f-body);font-size:1rem"></div>`);
    t.qs.forEach((q,i)=>ql.append(qItem(t.kind==="mc"?Object.assign({t:"mc"},q):Object.assign({max:4},q),`h:${t.id}:${i}`,t.kind==="notes"?i+1:null)));
    task.append(ql);
  }
  body.append(task);
};

// ---------- WRITING ----------
function barChart(c,i){
  const max=Math.max(...c.data.map(d=>d[1])); const top=Math.ceil(max/10)*10||10; const row=30, lab=178, W=600, right=50, H=c.data.length*row+40;
  const x=v=>lab+(W-lab-right)*v/top;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">`;
  const step=top<=20?5:top<=50?10:20; for(let t=0;t<=top;t+=step){g+=`<line x1="${x(t)}" x2="${x(t)}" y1="8" y2="${H-26}" stroke="var(--line)"/><text x="${x(t)}" y="${H-8}" font-size="11" text-anchor="middle" class="lab">${+t.toFixed(1)}%</text>`}
  c.data.forEach(([l,v],k)=>{const y=12+k*row; const w=Math.max(2,x(v)-lab);
    g+=`<g><title>${esc(l)}: ${v}%</title><text x="${lab-10}" y="${y+15}" font-size="13" text-anchor="end">${esc(l)}</text><path d="M${lab},${y+3} h${w-4} a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-${w-4} z" fill="${i?"var(--bar2)":"var(--bar)"}"/><text x="${lab+w+6}" y="${y+15}" font-size="12.5" font-weight="700">${v}%</text></g>`});
  return `<figure class="chart" style="margin:0;display:grid;gap:6px"><figcaption class="small"><b>${esc(c.title)}</b></figcaption><div class="tablebox">${g}</svg></div></figure>`;
}
function analyseReport(text,task){
  const out=[]; const words=(text.match(/[A-Za-zÀ-ÿ0-9%’'-]+/g)||[]); const wc=words.length;
  const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const push=(cls,msg)=>out.push([cls,msg]);
  push(wc>=180&&wc<=220?"ok":wc>=165&&wc<=240?"warn":"bad",`Word count: ${wc} (target 180–220).`);
  const hdr=["to","from","date","subject"].filter(k=>lines.some(l=>new RegExp("^"+k+"\\s*:","i").test(l)));
  push(hdr.length===4?"ok":"bad",hdr.length===4?"Header complete (To / From / Date / Subject).":`Header incomplete – missing: ${["To","From","Date","Subject"].filter(k=>!hdr.includes(k.toLowerCase())).join(", ")}.`);
  const heads=lines.filter(l=>!/:/.test(l)&&l.split(/\s+/).length<=6&&!/[.!?]$/.test(l));
  const need=["introduction","recommendation","conclusion"]; const miss=need.filter(n=>!heads.some(hh=>hh.toLowerCase().includes(n)));
  push(heads.length>=4&&!miss.length?"ok":"warn",`Headings found: ${heads.length?heads.map(x=>"“"+x+"”").join(", "):"none"}.${miss.length?" Missing: "+miss.join(", ")+".":""}`);
  const intro=(()=>{const i=lines.findIndex(l=>/^introduction/i.test(l));return i>=0?lines.slice(i+1,i+3).join(" "):""})();
  if(intro){const a=/aim|purpose|this report (examines|presents|outlines)/i.test(intro),an=/analys|explain|reason|examin/i.test(intro),r=/recommend|suggest|solution|propos/i.test(intro),s=/based on|survey|chart|data|study|source|conducted/i.test(intro);
    push(a&&an&&r&&s?"ok":"bad",`Introduction: aim ${a?"✓":"✗"} · analysis ${an?"✓":"✗"} · recommendations ${r?"✓":"✗"} · source ${s?"✓":"✗"}${a&&an&&r&&s?"":" ← your teacher marked this last time!"}`)}
  else push("warn","Introduction: write a heading ‘Introduction’ so I can check it.");
  const pr=[...text.matchAll(/\b(I|me|my|we|our|us|you|your)\b/g)].filter(m=>!(m[1]==="us"&&/US/.test(text.slice(m.index-1,m.index+3))));
  push(pr.length?"bad":"ok",pr.length?`Personal pronouns: ${pr.length}× (${[...new Set(pr.map(m=>m[1]))].join(", ")}) – make them impersonal (it would be advisable…, the school should…).`:"No personal pronouns. ✓");
  const con=text.match(/\b\w+(n['’]t|['’](re|ve|ll|m|d))\b|\b(it|that|there|what|he|she)['’]s\b/gi)||[];
  push(con.length?"bad":"ok",con.length?`Contractions: ${[...new Set(con)].join(", ")} – write them out in full.`:"No contractions. ✓");
  const inf=["kids","lots of","a lot of","loads","stuff","things","really","pretty","huge","awesome","cool","okay","ok","gonna","wanna","get","got","basically","so,","totally","super"]; const found=inf.filter(w=>new RegExp("\\b"+w.replace(",","")+"\\b"+(w.endsWith(",")?",":""),"i").test(text));
  push(found.length?"warn":"ok",found.length?`Informal words: ${found.join(", ")} – try a formal word (many / a large number of / considerably / obtain…).`:"No informal words found. ✓");
  const lk=LINKERS.concat(["followed by","by contrast","overall","in conclusion","to sum up","in summary","in order to","consequently","additionally","similarly","due to"]).filter(l=>text.toLowerCase().includes(l.toLowerCase().replace(/,$/,"")));
  push(lk.length>=6?"ok":"warn",`Linking words used: ${lk.length} (${lk.map(x=>x.replace(/,$/,"")).join(", ")||"none"}). Aim for 6+ different ones.`);
  const stat=["majority","minority","proportion","third","quarter","half","fifth","one in","significant number","most popular","least popular","followed by","just under","just over","around","approximately"].filter(s=>text.toLowerCase().includes(s));
  push(stat.length>=3?"ok":"warn",`Statistics phrases: ${stat.length} (${stat.join(", ")||"none"}).`);
  const rec=/advisable|beneficial|should consider|recommended|possible solution|would be useful|it would be|should be/i.test(text);
  push(rec?"ok":"bad",rec?"Formal recommendation phrases found. ✓":"No formal recommendation phrase found (it would be advisable to…, the school should consider…).");
  if(task){ const src=(task.situation+" "+task.bullets.join(" ")).toLowerCase().replace(/[^a-z0-9’' -]/g," ").split(/\s+/).filter(Boolean);
    const grams=new Set(); for(let i=0;i+4<=src.length;i++) grams.add(src.slice(i,i+4).join(" "));
    const tw=text.toLowerCase().replace(/[^a-z0-9’' -]/g," ").split(/\s+/).filter(Boolean); const hits=new Set();
    for(let i=0;i+4<=tw.length;i++){const g=tw.slice(i,i+4).join(" "); if(grams.has(g)) hits.add(g)}
    const GEN=new Set("the of a an to and in on for how could would should results result survey report based make recommendations recommendation main data chart this that is are be with from by their its what which may more as at or".split(" "));
    const lift=[...hits].filter(g=>!g.split(" ").every(w=>GEN.has(w)));
    push(lift.length?"bad":"ok",lift.length?`Prompt lifting – copied from the task: ${lift.slice(0,6).map(g=>"“"+g+"”").join(", ")}${lift.length>6?" …":""}. Say it in your own words!`:"No phrases copied from the task. ✓"); }
  return out;
}
VIEWS.writing=root=>{
  const tabs=[["feedback","Your teacher’s feedback"],["format","Format & phrases"],["models","Model reports"],["drills","Drills"],["write","Write a report"]];
  root.innerHTML=`<div style="display:grid;gap:6px"><span class="eyebrow">Writing · the biggest part of the test</span><h2>The report, the way your class does it</h2><p class="lead">180–220 words, based on a chart. Header, then Introduction · Results · Analysis · Recommendations · Conclusion. Formal, impersonal, linked, and nothing copied from the task.</p></div>
  <div class="chips">${tabs.map(([id,n])=>`<button class="chip" data-w="${id}" aria-pressed="${VS.wtab===id}">${n}</button>`).join("")}</div><div id="wbody" style="display:grid;gap:14px"></div>`;
  $$(".chip[data-w]",root).forEach(b=>b.onclick=()=>{VS.wtab=b.dataset.w;saveVS();route()});
  const body=$("#wbody");
  ({feedback:wFeedback,format:wFormat,models:wModels,drills:wDrills,write:wWrite})[VS.wtab](body);
};
function wFeedback(body){
  body.append(h(`<div class="note">Your organic food report got <b>8/11</b>: “well-structured”, “good use of language”, “good use of linking words”. Four things cost points. Fix these and you are at the top.</div>`));
  FEEDBACK.forEach((f,i)=>body.append(h(`<div class="card"><div class="row"><span class="pill ${i<4?"red":"green"}">${i<4?"Fix "+(i+1):"Keep"}</span><h3>${esc(f.t)}</h3></div><p class="small muted">${esc(f.note)}</p>${f.before?`<div class="fix"><span class="small muted">Your version</span><span class="before">${esc(f.before)}</span><span class="small muted">Better</span><span class="after">${esc(f.after)}</span></div>`:`<p><b>${esc(f.after)}</b></p>`}</div>`)));
  const r=h(`<div class="row"><button class="btn primary">Practise these in the drills</button><button class="btn">Rewrite the organic food report</button></div>`);body.append(r);
  r.children[0].onclick=()=>{VS.wtab="drills";saveVS();route()}; r.children[1].onclick=()=>{VS.wtab="write";VS.wtask="t-organic";saveVS();route()};
}
function wFormat(body){
  body.append(h(`<div class="card"><h3>Layout at a glance</h3><div class="rep" style="max-width:36rem"><div class="hd">To: …<br>From: …<br>Date: …<br>Subject: …</div><h4>Introduction</h4><p class="small">aim (results + analysis + recommendations) · source</p><h4>Results</h4><p class="small">the numbers, biggest first, linked</p><h4>Analysis</h4><p class="small">possible reasons (may, could, likely)</p><h4>Recommendations</h4><p class="small">impersonal suggestions</p><h4>Conclusion</h4><p class="small">main finding + main recommendation</p></div><p class="small muted">Your class model (Max Mustermann) used exactly these headings: Introduction, Results, Analysis, Recommendations, Conclusion.</p></div>`));
  REPORT_STRUCTURE.forEach(s=>body.append(h(`<div class="card"><h3>${esc(s.h)}</h3><p class="small muted">${esc(s.what)}</p>${s.ex?`<div class="rep"><div class="hd">${s.ex}</div></div>`:""}<ul class="clean">${s.ph.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`)));
  body.append(h(`<div class="card"><h3>Linking ideas</h3><p>${LINKERS.map(esc).join(" · ")}</p></div>`));
}
function wModels(body){
  MODELS.forEach(m=>{const c=h(`<div class="card"><div class="row"><h3>${esc(m.title)}</h3><span class="spacer"></span><span class="pill">${m.words}</span><label class="small row" style="gap:6px"><input type="checkbox" class="hl" checked> highlights</label></div><div class="rep">${m.html}</div><ol class="notes" style="margin:0;padding-left:1.4em">${m.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ol></div>`);
    $$("mark",c).forEach(mk=>{mk.insertAdjacentHTML("beforeend",`<sup>${mk.dataset.n}</sup>`);mk.onclick=()=>popup("Note "+mk.dataset.n,`<p>${esc(m.notes[mk.dataset.n-1])}</p>`)});
    $(".hl",c).onchange=e=>$$("mark",c).forEach(mk=>{mk.style.background=e.target.checked?"":"transparent";$("sup",mk).hidden=!e.target.checked});
    body.append(c)});
}
function wDrills(body){
  const sec=(title,lead,items,fn)=>{const c=h(`<div class="card"><h3>${title}</h3>${lead?`<p class="small muted">${lead}</p>`:""}<div class="qlist"></div></div>`);items.forEach((it,i)=>$(".qlist",c).append(fn(it,i)));body.append(c)};
  sec("1 · What is a report? (Task 4)","Fill the gaps from memory.",WRITE_DRILLS.whatis,(it,i)=>qItem(it,`w:whatis:${i}`,i+1));
  sec("2 · Spot the prompt lifting","Which heading would your teacher accept?",WRITE_DRILLS.lifting,(it,i)=>qItem({t:"mc",q:`Task bullet: “${it.task}”`,o:it.o,a:it.a,ex:it.ex},`w:lift:${i}`,i+1));
  sec("3 · Say the task in your own words","For the introduction. Write, then compare with the model.",WRITE_DRILLS.paraphrase,(it,i)=>qItem({t:"self",q:it.q,m:it.m},`w:para:${i}`,i+1));
  sec("4 · Make it formal and impersonal (Task 5)","No I / we, no contractions, no informal words.",WRITE_DRILLS.formal,(it,i)=>qItem({t:"self",q:it.q,m:it.m},`w:formal:${i}`,i+1));
  const statC=h(`<div class="card"><h3>5 · Describe the chart</h3><p class="small muted">Use the Task 8 chart. Choose the phrase that fits the number.</p>${barChart(REPORT_TASKS[0].charts[0],0)}<div class="qlist"></div></div>`);
  [{q:"Health (13.9%) is ___ option.",o:["the most popular","the least popular","a small minority","the majority"],a:0,ex:"13.9% is the highest bar."},
   {q:"___ of 16-year-olds (10.4%) are not yet sure.",o:["Just over one in ten","Just under a third","Nearly half","A quarter"],a:0,ex:"One in ten = 10%; 10.4% is just over."},
   {q:"Art and music (13%) comes second, ___ by sport (11.3%).",o:["followed","following","follows","to follow"],a:0,ex:"…, followed by …"},
   {q:"Education and the armed forces/police ___ the same share (7.8%).",o:["have","are","make","do"],a:0,ex:"have the same share / account for the same share."},
   {q:"Among 11-year-olds, sport is ___ the most popular choice (29%).",o:["by far","far by","so far","farther"],a:0,ex:"by far + superlative = mit Abstand."},
   {q:"Fewer than one in ten 16-year-olds want to work in media, ___ 13% are interested in art or music.",o:["whereas","despite","although of","because"],a:0,ex:"Contrast inside one sentence → whereas / while."}].forEach((it,i)=>$(".qlist",statC).append(qItem(Object.assign({t:"mc"},it),`w:stat:${i}`,i+1)));
  body.append(statC);
}
function wWrite(body){
  const t=REPORT_TASKS.find(x=>x.id===VS.wtask)||REPORT_TASKS[0];
  body.append(h(`<div class="chips">${REPORT_TASKS.map(x=>`<button class="chip" data-k="${x.id}" aria-pressed="${x.id===t.id}">${esc(x.title)}</button>`).join("")}</div>`));
  $$(".chip[data-k]",body).forEach(b=>b.onclick=()=>{VS.wtask=b.dataset.k;saveVS();route()});
  const paper=h(`<div class="paper">${paperHead("Schreiben",null)}<p>${esc(t.situation)}</p><p class="instr">In your report, you should:</p><ul style="margin:0;display:grid;gap:4px">${t.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul><p class="instr">Write approximately 180–220 words. Write it for: ${esc(t.to)}.</p><div class="grid2" style="font-family:var(--f-body)">${t.charts.map((c,i)=>barChart(c,i)).join("")}</div></div>`);
  body.append(paper);
  const key="draft-"+t.id; const mdl=t.id==="t-organic"?MODELS[0]:t.id==="t-jobs"?MODELS[1]:null;
  const ed=h(`<div class="card"><div class="row"><h3>Your report</h3><span class="spacer"></span><span class="timer" id="tm">45:00</span><select id="tmSel" aria-label="time"><option value="45">45 min</option><option value="60">60 min</option><option value="30">30 min</option></select><button class="btn small" id="tmGo">Start timer</button></div>
    <div class="row"><button class="btn small" id="hdr">Insert header + headings</button><span class="spacer"></span><span class="score" id="wc">0 words</span></div>
    <textarea class="paperish" id="draft" placeholder="To: …&#10;From: …&#10;Date: …&#10;Subject: …&#10;&#10;Introduction&#10;The aim of this report is to …"></textarea>
    <div class="row"><button class="btn primary" id="chk">Check my report</button>${mdl?`<button class="btn" id="mdl">Model answer</button>`:""}<span class="small muted">Saved automatically in this browser.</span></div>
    <ul class="clean check" id="res"></ul></div>`);
  body.append(ed);
  const ta=$("#draft",ed); ta.value=store.get(key,"");
  const wc=()=>{const n=(ta.value.match(/[A-Za-zÀ-ÿ0-9%’'-]+/g)||[]).length;$("#wc",ed).textContent=`${n} words`;$("#wc",ed).style.color=n>=180&&n<=220?"var(--green)":n>220?"var(--red)":""};
  ta.oninput=()=>{store.set(key,ta.value);wc()}; wc();
  $("#hdr",ed).onclick=()=>{const d=new Date();const ds=`${d.getDate()} ${d.toLocaleString("en-GB",{month:"long"})} ${d.getFullYear()}`;ta.value=`To: ${t.to}\nFrom: \nDate: ${ds}\nSubject: \n\nIntroduction\n\n\nResults\n\n\nAnalysis\n\n\nRecommendations\n\n\nConclusion\n`+(ta.value?"\n"+ta.value:"");ta.oninput()};
  $("#chk",ed).onclick=()=>{const r=analyseReport(ta.value,t);$("#res",ed).innerHTML=r.map(([c,m])=>`<li class="${c}">${esc(m)}</li>`).join("")+`<li class="muted">Still check yourself: every bullet point answered? Tenses and 3rd person -s? Spelling of key words?</li>`};
  if(mdl) $("#mdl",ed).onclick=()=>popup(mdl.title,`<div class="rep">${mdl.html}</div>`);
  let left=45*60, iv=null; const show=()=>{$("#tm",ed).textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`};
  $("#tmSel",ed).onchange=e=>{clearInterval(iv);iv=null;left=+e.target.value*60;$("#tmGo",ed).textContent="Start timer";show()};
  $("#tmGo",ed).onclick=()=>{if(iv){clearInterval(iv);iv=null;$("#tmGo",ed).textContent="Resume";return}$("#tmGo",ed).textContent="Pause";iv=setInterval(()=>{if(!document.body.contains(ed)){clearInterval(iv);return}left--;show();if(left<=0){clearInterval(iv);iv=null;$("#tm",ed).style.color="var(--red)";$("#tmGo",ed).textContent="Time is up"}},1000)};
}

VIEWS.mock=root=>{
  root.innerHTML=`<div style="display:grid;gap:6px"><span class="eyebrow">Mixed test</span><h2>20 random questions from everything</h2><p class="lead">10 vocabulary gaps (no hints), 6 grammar, 4 word formation. A new set every time.</p></div><div class="row"><button class="btn primary" id="newT">New test</button><span class="spacer"></span><span class="score" id="mScore"></span></div><div class="qlist" id="ml"></div>`;
  const words=allWords().filter(w=>w.gap&&w.set!=="rep"); const gr=GRAMMAR.flatMap(t=>t.items.map((it,i)=>({it,id:`g:${t.id}:${i}`})));
  const items=[...shuffle(words).slice(0,10).map(w=>({it:{q:w.gap,a:[w.ans],ex:""},id:w.id,extra:`<p><b>${esc(w.term)}</b> · <span class="muted">${esc(w.de)}</span></p><p>${esc(w.def)}</p>`})),...shuffle(gr).slice(0,6),...shuffle(WFDRILL).slice(0,4).map(it=>({it,id:"l:wf:"+WFDRILL.indexOf(it)}))];
  let ok=0,done=new Set(); const upd=()=>$("#mScore").textContent=`${ok} / ${items.length} correct`;
  shuffle(items).forEach((x,i)=>$("#ml").append(qItem(x.it,x.id,i+1,{extra:x.extra,onResult:r=>{if(r&&!done.has(x.id)){done.add(x.id);ok++;upd()}}})));
  $("#newT").onclick=route; upd();
};

route();
